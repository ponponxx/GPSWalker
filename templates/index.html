<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GPSWalker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 340px; height: 100vh; }
  #map { width: 100%; height: 100%; }
  #panel { padding: 14px; background: #1d1f24; color: #e6e6e6; overflow-y: auto; }
  #panel h2 { margin: 0 0 8px; font-size: 16px; }
  #panel section { margin-bottom: 16px; border-top: 1px solid #333; padding-top: 12px; }
  #panel section:first-of-type { border-top: none; padding-top: 0; }
  label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
  input[type=number], input[type=text] {
    width: 100%; padding: 6px; background: #2a2d34; border: 1px solid #444;
    color: #fff; border-radius: 4px; box-sizing: border-box; }
  button { width: 100%; padding: 8px; background: #3a7afe; color: white; border: 0;
           border-radius: 4px; cursor: pointer; font-size: 14px; margin-top: 6px; }
  button.secondary { background: #555; }
  button.danger { background: #c0392b; }
  button.active { background: #f39c12; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .kv { font-size: 12px; color: #bbb; line-height: 1.6; }
  .kv b { color: #fff; }
  .badge { display: inline-block; padding: 2px 6px; border-radius: 3px;
           font-size: 11px; background: #444; color: #fff; }
  .badge.run { background: #27ae60; }
  #joy-wrap { position: relative; width: 200px; height: 200px; margin: 8px auto;
              background: #2a2d34; border-radius: 50%; touch-action: none;
              border: 2px solid #444; }
  #joy-knob { position: absolute; width: 64px; height: 64px; border-radius: 50%;
              background: #3a7afe; left: 68px; top: 68px; pointer-events: none;
              box-shadow: 0 2px 10px rgba(0,0,0,.4); }
  .hint { font-size: 11px; color: #888; margin-top: 4px; }
  #wp-list { max-height: 140px; overflow-y: auto; font-size: 12px;
             background: #15171b; border-radius: 4px; padding: 4px; margin-top: 4px; }
  .wp-row { display: flex; justify-content: space-between; align-items: center;
            padding: 3px 4px; border-bottom: 1px solid #2a2d34; }
  .wp-row:last-child { border-bottom: 0; }
  .wp-row .x { background: transparent; color: #c0392b; width: 22px;
               padding: 0; margin: 0; font-weight: bold; cursor: pointer; }
  .waypoint-icon {
    background: #f39c12; color: #000; border-radius: 50%;
    width: 22px; height: 22px; line-height: 22px; text-align: center;
    font-size: 11px; font-weight: bold; border: 2px solid #fff;
    box-shadow: 0 0 4px rgba(0,0,0,.5);
  }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="panel">
    <h2>GPSWalker <span class="badge">{{ provider }}</span></h2>
    <div class="kv">ADB devices: <b>{{ devices|length }}</b>
      {% for d in devices %}<div>&nbsp;&nbsp;{{ d }}</div>{% endfor %}
    </div>

    <section>
      <label>Speed (km/h)</label>
      <input id="speed" type="number" min="0.1" max="9999" step="0.1"
             value="{{ '%.1f'|format(initial.speed_kmh) }}">
      <div class="hint">~4.5 walk · ~12 jog · ~25 cycle</div>
    </section>

    <section>
      <label>Set Position (teleport)</label>
      <div class="row">
        <input id="pos-lat" type="number" step="0.000001"
               value="{{ '%.6f'|format(initial.lat) }}">
        <input id="pos-lon" type="number" step="0.000001"
               value="{{ '%.6f'|format(initial.lon) }}">
      </div>
      <button id="teleport-btn" class="secondary">Teleport to coords</button>
      <div class="hint">or right-click on map to teleport</div>
    </section>

    <section>
      <label>Target (single point)</label>
      <div class="kv" id="target-info">double-click on map to set</div>
      <button id="start-btn">Start walk to target</button>
      <button id="clear-btn" class="secondary">Clear target</button>
    </section>

    <section>
      <label>Multi-point Route</label>
      <button id="wp-add-btn" class="secondary">Add waypoints: OFF</button>
      <div class="hint">when ON, click map to drop waypoints in order</div>
      <div id="wp-list"></div>
      <button id="route-start-btn">Start route</button>
      <button id="route-clear-btn" class="secondary">Clear route</button>
    </section>

    <section>
      <label>Joystick (drag)</label>
      <div id="joy-wrap"><div id="joy-knob"></div></div>
      <div class="hint">release to stop</div>
    </section>

    <section>
      <label>Status</label>
      <div class="kv" id="status"></div>
      <button id="stop-btn" class="danger">STOP</button>
    </section>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
const initial = {{ initial|tojson }};
const map = L.map('map', { doubleClickZoom: false }).setView([initial.lat, initial.lon], 16);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap'
}).addTo(map);
// suppress browser context menu so right-click on map can teleport
map.getContainer().addEventListener('contextmenu', e => e.preventDefault());

const meIcon = L.divIcon({className:'', html:
  '<div style="width:18px;height:18px;border-radius:50%;background:#3a7afe;'+
  'border:3px solid #fff;box-shadow:0 0 0 2px #3a7afe55"></div>',
  iconSize:[18,18], iconAnchor:[9,9]});
const meMarker = L.marker([initial.lat, initial.lon], {icon: meIcon}).addTo(map);
const trail = L.polyline([[initial.lat, initial.lon]], {color:'#3a7afe', weight:3, opacity:.6}).addTo(map);
let targetMarker = null;

// waypoint state
let addWpMode = false;
const waypoints = [];           // [{lat, lon}]
let wpMarkers = [];             // L.Marker[]
let routeLine = null;           // L.Polyline

const sock = io();

// ---- Notification permission ---------------------------------------
if ('Notification' in window) {
  if (Notification.permission === 'default') {
    Notification.requestPermission();
  }
}
function notifyComplete(s) {
  const msg = `Arrived at ${s.lat.toFixed(6)}, ${s.lon.toFixed(6)}`;
  try {
    if ('Notification' in window && Notification.permission === 'granted') {
      const n = new Notification('GPSWalker — destination reached', {
        body: msg, requireInteraction: false,
      });
      setTimeout(() => { try { n.close(); } catch(_){} }, 8000);
    }
  } catch (_) {}
  // also visual blink and beep
  document.title = '✓ Arrived — GPSWalker';
  setTimeout(() => { document.title = 'GPSWalker'; }, 6000);
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
    g.gain.value = 0.05; o.start();
    setTimeout(() => { o.frequency.value = 1320; }, 150);
    setTimeout(() => { o.stop(); ctx.close(); }, 350);
  } catch(_){}
}

// ---- Target ---------------------------------------------------------
function setTargetUI(latlng) {
  if (targetMarker) targetMarker.setLatLng(latlng);
  else targetMarker = L.marker(latlng, {opacity:.8}).addTo(map);
  document.getElementById('target-info').innerHTML =
    `<b>${latlng.lat.toFixed(6)}, ${latlng.lng.toFixed(6)}</b>`;
}
function clearTargetUI() {
  if (targetMarker) { map.removeLayer(targetMarker); targetMarker = null; }
  document.getElementById('target-info').textContent = 'double-click on map to set';
}

map.on('dblclick', (e) => {
  setTargetUI(e.latlng);
  sock.emit('set_target', {lat: e.latlng.lat, lon: e.latlng.lng});
});

// right-click → teleport
map.on('contextmenu', (e) => {
  const ll = e.latlng;
  sock.emit('set_position', {lat: ll.lat, lon: ll.lng});
  document.getElementById('pos-lat').value = ll.lat.toFixed(6);
  document.getElementById('pos-lon').value = ll.lng.toFixed(6);
});

// single click → add waypoint when in addWpMode
map.on('click', (e) => {
  if (!addWpMode) return;
  addWaypoint(e.latlng.lat, e.latlng.lng);
});

document.getElementById('speed').addEventListener('change', (e) => {
  sock.emit('set_speed', {kmh: parseFloat(e.target.value)});
});
document.getElementById('start-btn').onclick = () => {
  if (!targetMarker) { alert('double-click map to set a target first'); return; }
  const ll = targetMarker.getLatLng();
  sock.emit('set_target', {lat: ll.lat, lon: ll.lng});
};
document.getElementById('clear-btn').onclick = () => {
  sock.emit('clear_target'); clearTargetUI();
};
document.getElementById('stop-btn').onclick = () => {
  sock.emit('stop'); clearTargetUI(); clearRouteUI();
};

// ---- Teleport -------------------------------------------------------
document.getElementById('teleport-btn').onclick = () => {
  const lat = parseFloat(document.getElementById('pos-lat').value);
  const lon = parseFloat(document.getElementById('pos-lon').value);
  if (!isFinite(lat) || !isFinite(lon)) { alert('invalid lat/lon'); return; }
  sock.emit('set_position', {lat, lon});
};

// ---- Waypoints ------------------------------------------------------
const wpAddBtn = document.getElementById('wp-add-btn');
wpAddBtn.onclick = () => {
  addWpMode = !addWpMode;
  wpAddBtn.textContent = 'Add waypoints: ' + (addWpMode ? 'ON' : 'OFF');
  wpAddBtn.classList.toggle('active', addWpMode);
  map.getContainer().style.cursor = addWpMode ? 'crosshair' : '';
};
function wpDivIcon(i) {
  return L.divIcon({
    className: '',
    html: `<div class="waypoint-icon">${i+1}</div>`,
    iconSize: [22, 22], iconAnchor: [11, 11],
  });
}
function addWaypoint(lat, lon) {
  waypoints.push({lat, lon});
  renderWaypoints();
}
function removeWaypoint(i) {
  waypoints.splice(i, 1);
  renderWaypoints();
}
function renderWaypoints() {
  // clear existing markers
  wpMarkers.forEach(m => map.removeLayer(m));
  wpMarkers = [];
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  waypoints.forEach((p, i) => {
    const m = L.marker([p.lat, p.lon], {icon: wpDivIcon(i)}).addTo(map);
    wpMarkers.push(m);
  });
  if (waypoints.length >= 2) {
    routeLine = L.polyline(
      waypoints.map(p => [p.lat, p.lon]),
      {color:'#f39c12', weight:3, opacity:.7, dashArray:'6,6'}
    ).addTo(map);
  }
  // list
  const ul = document.getElementById('wp-list');
  if (!waypoints.length) {
    ul.innerHTML = '<div class="hint" style="padding:6px">no waypoints</div>';
  } else {
    ul.innerHTML = waypoints.map((p, i) =>
      `<div class="wp-row"><span>${i+1}. ${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}</span>` +
      `<button class="x" data-i="${i}" title="remove">✕</button></div>`
    ).join('');
    ul.querySelectorAll('button.x').forEach(b => {
      b.onclick = () => removeWaypoint(parseInt(b.dataset.i, 10));
    });
  }
}
function clearRouteUI() {
  waypoints.length = 0;
  renderWaypoints();
}
document.getElementById('route-start-btn').onclick = () => {
  if (waypoints.length < 1) { alert('add at least one waypoint by enabling add-mode and clicking the map'); return; }
  const pts = waypoints.map(p => [p.lat, p.lon]);
  sock.emit('set_route', {points: pts});
};
document.getElementById('route-clear-btn').onclick = () => {
  sock.emit('clear_route');
  clearRouteUI();
};

renderWaypoints();

// ---- Joystick -------------------------------------------------------
const wrap = document.getElementById('joy-wrap');
const knob = document.getElementById('joy-knob');
const RADIUS = 68;
const KNOB_HALF = 32;
let joyActive = false, joyId = null;
function joyMove(cx, cy) {
  const r = wrap.getBoundingClientRect();
  let dx = cx - (r.left + r.width/2);
  let dy = cy - (r.top  + r.height/2);
  const m = Math.hypot(dx, dy);
  if (m > RADIUS) { dx = dx * RADIUS / m; dy = dy * RADIUS / m; }
  knob.style.left = (KNOB_HALF + dx) + 'px';
  knob.style.top  = (KNOB_HALF + dy) + 'px';
  const nx = dx / RADIUS, ny = -dy / RADIUS;  // y up = north
  sock.emit('joystick', {x: nx, y: ny});
}
function joyReset() {
  knob.style.left = KNOB_HALF + 'px'; knob.style.top = KNOB_HALF + 'px';
  sock.emit('joystick', {x: 0, y: 0});
}
wrap.addEventListener('pointerdown', e => {
  joyActive = true; joyId = e.pointerId; wrap.setPointerCapture(e.pointerId);
  joyMove(e.clientX, e.clientY);
});
wrap.addEventListener('pointermove', e => {
  if (joyActive && e.pointerId === joyId) joyMove(e.clientX, e.clientY);
});
function joyUp(e) {
  if (joyActive && e.pointerId === joyId) { joyActive = false; joyReset(); }
}
wrap.addEventListener('pointerup', joyUp);
wrap.addEventListener('pointercancel', joyUp);

// ---- ETA formatting ------------------------------------------------
function fmtEta(sec) {
  if (!isFinite(sec) || sec <= 0) return '–';
  const s = Math.round(sec);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const r = s % 60;
  if (h > 0) return `${h}h ${m}m ${r}s`;
  if (m > 0) return `${m}m ${r}s`;
  return `${r}s`;
}
function fmtDist(m) {
  if (m >= 1000) return (m/1000).toFixed(2) + ' km';
  return Math.round(m) + ' m';
}

// ---- Live state -----------------------------------------------------
sock.on('state', (s) => {
  meMarker.setLatLng([s.lat, s.lon]);
  const pts = trail.getLatLngs();
  pts.push([s.lat, s.lon]);
  if (pts.length > 600) pts.shift();
  trail.setLatLngs(pts);
  const runBadge = s.running ? '<span class="badge run">RUN</span>' : '<span class="badge">idle</span>';
  const etaArr = new Date(Date.now() + (s.eta_s || 0) * 1000);
  const etaStr = (s.running && s.eta_s > 0)
    ? `${fmtEta(s.eta_s)} (≈${etaArr.toLocaleTimeString()})`
    : '–';
  const distStr = (s.running && s.remaining_m > 0) ? fmtDist(s.remaining_m) : '–';
  const routeStr = (s.mode === 'walk_route' && s.route && s.route.length)
    ? ` · wp ${Math.min(s.route_index+1, s.route.length)}/${s.route.length}` : '';
  document.getElementById('status').innerHTML =
    `${runBadge} mode: <b>${s.mode}</b>${routeStr}<br>` +
    `lat: <b>${s.lat.toFixed(6)}</b><br>` +
    `lon: <b>${s.lon.toFixed(6)}</b><br>` +
    `speed: <b>${s.speed_kmh.toFixed(1)}</b> km/h<br>` +
    `remaining: <b>${distStr}</b><br>` +
    `ETA: <b>${etaStr}</b>`;
  if (!s.target && targetMarker) clearTargetUI();
});

sock.on('completed', (s) => {
  notifyComplete(s);
});
</script>
</body>
</html>
